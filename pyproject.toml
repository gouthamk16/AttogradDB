[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attogradDB"
version = "0.9.1"
description = "A lightweight, local-first vector store for scoped semantic retrieval"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Goutham Krishnan" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "onnxruntime",
    "tokenizers",
    "huggingface_hub",
    "pypdf",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/gouthamk16/AttogradDB"

[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "twine"]

[tool.setuptools.packages.find]
include = ["attogradDB*"]

[tool.pytest.ini_options]
testpaths = ["attogradDB/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# N is omitted: the package and keyValueStore keep their camelCase published names.
select = ["E", "F", "I", "UP"]
